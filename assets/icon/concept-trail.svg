<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Concept Trail: a notebook whose night-blue cover carries a trail of
       stars climbing to the one it leads to, and the pen still writing its
       newest branch. The idea tree's sky, the note it grows from, and the
       path from a first thought to a product. Qt's SVG renderer (which draws
       the .ico and the window icon) ignores clipPath: every layer stays
       inside the tile by its own shape. -->
  <defs>
    <linearGradient id="ct-sky" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1b2b5c"/>
      <stop offset="0.52" stop-color="#0d1734"/>
      <stop offset="1" stop-color="#060b1c"/>
    </linearGradient>
    <radialGradient id="ct-nebula" cx="0.26" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ct-dawn" cx="0.76" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#6fe0c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fe0c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ct-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#b5f5e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fe0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ct-trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#b9a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8eeccf"/>
    </linearGradient>
    <linearGradient id="ct-pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2f2"/>
    </linearGradient>
    <linearGradient id="ct-nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#e8a93a"/>
    </linearGradient>
    <linearGradient id="ct-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c97bd"/>
      <stop offset="0.5" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#8c97bd"/>
    </linearGradient>
  </defs>

  <!-- the cover -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-sky)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-nebula)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-dawn)"/>

  <!-- faint ruling, the note under the sky -->
  <g stroke="#dfe7ff" stroke-opacity=".075" stroke-width="2" stroke-linecap="round">
    <path d="M62 72 H226"/><path d="M62 100 H232"/><path d="M62 128 H234"/>
    <path d="M62 156 H234"/><path d="M62 184 H230"/><path d="M62 212 H214"/>
  </g>

  <!-- far stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="46" r="1.4" opacity=".45"/><circle cx="126" cy="50" r="1.6" opacity=".5"/>
    <circle cx="226" cy="138" r="1.7" opacity=".5"/><circle cx="66" cy="132" r="1.4" opacity=".4"/>
    <circle cx="132" cy="220" r="1.5" opacity=".42"/><circle cx="228" cy="100" r="1.2" opacity=".45"/>
    <circle cx="96" cy="228" r="1.2" opacity=".35"/><circle cx="178" cy="120" r="1.3" opacity=".4"/>
  </g>

  <!-- the trail, and the branch the pen is writing now -->
  <path d="M78 190 L112 150 L106 110 L152 94 L190 70" fill="none" stroke="url(#ct-trail)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 150 L149 158" fill="none" stroke="#ff8fc8" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>

  <!-- stars along it: glow, colour, white heart -->
  <circle cx="78" cy="190" r="16" fill="#ffd166" opacity=".22"/>
  <circle cx="78" cy="190" r="8.5" fill="#ffd166"/><circle cx="78" cy="190" r="3.4" fill="#fffaf0"/>
  <circle cx="112" cy="150" r="17" fill="#7cc0ff" opacity=".22"/>
  <circle cx="112" cy="150" r="9.5" fill="#7cc0ff"/><circle cx="112" cy="150" r="3.8" fill="#f4fbff"/>
  <circle cx="106" cy="110" r="15" fill="#b9a6ff" opacity=".22"/>
  <circle cx="106" cy="110" r="8" fill="#b9a6ff"/><circle cx="106" cy="110" r="3.2" fill="#f7f4ff"/>
  <circle cx="152" cy="94" r="17" fill="#b9a6ff" opacity=".22"/>
  <circle cx="152" cy="94" r="9.5" fill="#b9a6ff"/><circle cx="152" cy="94" r="3.8" fill="#f7f4ff"/>

  <!-- where the trail leads: the bright star, with its glint -->
  <circle cx="190" cy="70" r="44" fill="url(#ct-halo)"/>
  <path d="M190 32 L195.2 64.8 L228 70 L195.2 75.2 L190 108 L184.8 75.2 L152 70 L184.8 64.8 Z" fill="#effff9"/>
  <path d="M190 51 L192.8 67.2 L209 70 L192.8 72.8 L190 89 L187.2 72.8 L171 70 L187.2 67.2 Z"
        fill="#ffffff" transform="rotate(45 190 70)" opacity=".7"/>
  <circle cx="190" cy="70" r="9" fill="#ffffff"/>

  <!-- the pen, nib on the page where the branch ends -->
  <g transform="translate(152 159) rotate(40)">
    <g transform="translate(3 5)" fill="#000000" opacity=".28">
      <path d="M0 0 L25 -8 L29 -8 L29 8 L25 8 Z"/><rect x="29" y="-10" width="68" height="20" rx="7"/>
    </g>
    <path d="M0 0 L25 -8 L29 -8 L29 8 L25 8 Z" fill="url(#ct-nib)"/>
    <path d="M5 0 L21 0" stroke="#3a2a10" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="2.1" fill="#3a2a10"/>
    <rect x="29" y="-9.5" width="13" height="19" rx="2" fill="#2b3d78"/>
    <rect x="42" y="-10" width="55" height="20" rx="7" fill="url(#ct-pen)"/>
    <rect x="48" y="-13" width="38" height="4.5" rx="2.2" fill="#8eeccf"/>
    <rect x="42" y="-10" width="7" height="20" rx="2" fill="#6fe0c4"/>
  </g>

  <!-- the binding: rings through the cover's edge -->
  <g>
    <circle cx="40" cy="62" r="5" fill="#050914"/><circle cx="40" cy="98" r="5" fill="#050914"/>
    <circle cx="40" cy="134" r="5" fill="#050914"/><circle cx="40" cy="170" r="5" fill="#050914"/>
    <circle cx="40" cy="206" r="5" fill="#050914"/>
    <g fill="none" stroke="url(#ct-ring)" stroke-width="5.5" stroke-linecap="round">
      <path d="M17 58 C 24 50, 40 50, 40 62"/><path d="M17 94 C 24 86, 40 86, 40 98"/>
      <path d="M17 130 C 24 122, 40 122, 40 134"/><path d="M17 166 C 24 158, 40 158, 40 170"/>
      <path d="M17 202 C 24 194, 40 194, 40 206"/>
    </g>
  </g>

  <!-- a hairline rim, so the tile holds its edge on any wallpaper -->
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
</svg>

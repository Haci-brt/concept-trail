<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Concept Trail: a trail of stars climbing to the one it leads to — the
       idea tree's night sky, and the path from a first thought to a product. -->
  <defs>
    <linearGradient id="ct-sky" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1b2b5c"/>
      <stop offset="0.52" stop-color="#0d1734"/>
      <stop offset="1" stop-color="#060b1c"/>
    </linearGradient>
    <radialGradient id="ct-nebula" cx="0.22" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ct-dawn" cx="0.76" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#6fe0c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fe0c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ct-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#b5f5e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fe0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ct-trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#b9a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8eeccf"/>
    </linearGradient>
  </defs>

  <!-- every layer is its own rounded tile: Qt's SVG renderer (which draws the
       .ico and the window icon) ignores clipPath -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-sky)"/>
  <g>
    <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-nebula)"/>
    <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ct-dawn)"/>
    <!-- a faint band of far stars across the sky -->
    <g fill="#ffffff">
      <circle cx="40" cy="62" r="1.8" opacity=".55"/><circle cx="70" cy="40" r="1.3" opacity=".45"/>
      <circle cx="118" cy="48" r="1.6" opacity=".5"/><circle cx="222" cy="140" r="1.7" opacity=".5"/>
      <circle cx="206" cy="198" r="1.3" opacity=".4"/><circle cx="46" cy="126" r="1.4" opacity=".4"/>
      <circle cx="132" cy="214" r="1.6" opacity=".45"/><circle cx="228" cy="92" r="1.2" opacity=".45"/>
      <circle cx="84" cy="224" r="1.2" opacity=".35"/><circle cx="170" cy="126" r="1.3" opacity=".4"/>
    </g>
    <!-- the trail, and one branch off it -->
    <path d="M58 196 L100 158 L94 112 L146 94 L186 70" fill="none" stroke="url(#ct-trail)"
          stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 158 L152 170" fill="none" stroke="#ff8fc8" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
    <!-- the stars along it: glow, colour, white heart -->
    <g>
      <circle cx="58" cy="196" r="17" fill="#ffd166" opacity=".22"/>
      <circle cx="58" cy="196" r="9" fill="#ffd166"/><circle cx="58" cy="196" r="3.6" fill="#fffaf0"/>
      <circle cx="100" cy="158" r="18" fill="#7cc0ff" opacity=".22"/>
      <circle cx="100" cy="158" r="10" fill="#7cc0ff"/><circle cx="100" cy="158" r="4" fill="#f4fbff"/>
      <circle cx="152" cy="170" r="12" fill="#ff8fc8" opacity=".22"/>
      <circle cx="152" cy="170" r="6.5" fill="#ff8fc8"/><circle cx="152" cy="170" r="2.6" fill="#fff5fa"/>
      <circle cx="94" cy="112" r="16" fill="#b9a6ff" opacity=".22"/>
      <circle cx="94" cy="112" r="8.5" fill="#b9a6ff"/><circle cx="94" cy="112" r="3.4" fill="#f7f4ff"/>
      <circle cx="146" cy="94" r="18" fill="#b9a6ff" opacity=".22"/>
      <circle cx="146" cy="94" r="10" fill="#b9a6ff"/><circle cx="146" cy="94" r="4" fill="#f7f4ff"/>
    </g>
    <!-- where the trail leads: the bright star, with its glint -->
    <circle cx="186" cy="70" r="46" fill="url(#ct-halo)"/>
    <path d="M186 30 L191.5 64.5 L226 70 L191.5 75.5 L186 110 L180.5 75.5 L146 70 L180.5 64.5 Z" fill="#effff9"/>
    <path d="M186 50 L189 67 L206 70 L189 73 L186 90 L183 73 L166 70 L183 67 Z" fill="#ffffff" transform="rotate(45 186 70)" opacity=".7"/>
    <circle cx="186" cy="70" r="9.5" fill="#ffffff"/>
  </g>
  <!-- a hairline rim, so the tile holds its edge on any wallpaper -->
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
</svg>
